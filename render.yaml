services:
  - type: web
    name: ak-talent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: rate limiting needs the real client IP behind Render's proxy (X-Forwarded-For)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES_ON_STARTUP
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: https://www.aktalent.com.br
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APPINTELLI_INTEGRATION_SECRET
        sync: false
